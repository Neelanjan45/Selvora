<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Explore the Selvora fragrance collection." />
  <title>Collection — Selvora</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/collection.css" />
</head>

<body class="collection-page">
  <div class="site-shell">

    <div id="site-nav"></div>

    <main>
      <header class="collection-hero">
        <div class="collection-hero-inner">
          <div class="section-label">Selvora / Collection</div>
          <h1>Scents to<br /><em>remember.</em></h1>
          <p>
            Fragrances composed around moments, moods and impressions —
            each one unfolding differently on the skin.
          </p>
        </div>
      </header>

      <section class="collection-catalogue" aria-labelledby="collection-title">
        <div class="catalogue-header">
          <div>
            <div class="section-label">The collection</div>
            <h2 id="collection-title">Explore Selvora</h2>
          </div>
          <p id="productCount" class="product-count" aria-live="polite"></p>
        </div>

        <div id="productGrid" class="collection-grid" aria-live="polite"></div>

        <div id="collectionLoading" class="collection-state">
          <span class="state-line"></span>
          <p>Discovering the collection...</p>
        </div>

        <div id="collectionEmpty" class="collection-state" hidden>
          <p>The collection is currently unavailable.</p>
        </div>

        <div id="collectionError" class="collection-state" hidden>
          <p>We couldn't load the collection right now.</p>
          <button type="button" id="retryCollection" class="state-button">Try again</button>
        </div>
      </section>
    </main>

    <div id="site-footer"></div>
  </div>

  <script src="/components.js"></script>
  <script src="/collection.js"></script>
</body>
</html>
