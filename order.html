<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selvora - Nature & Nostalgia</title>
    <link rel="stylesheet" href="./styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <main>
        <div id="order_form_container">
            <div id="order_form">
                <div id="order_form_header">
                    <img src="Images/Selvora Beige.svg" alt="SELVORA" id="order_form_header_logo">
                </div>
                <form id="order_form_body">
                    <div class="form_group">
                        <div class="form_label">Name</div>
                        <input type="text" class="form_field" id="cust_name" required>
                    </div>
                    <div class="form_group">
                        <div class="form_label">Email</div>
                        <input type="email" class="form_field" id="cust_email" required>
                    </div>
                    <div class="form_group">
                        <div class="form_label">Contact</div>
                        <input type="tel" class="form_field" id="cust_contact" required>
                    </div>
                    
                    <div class="form_group">
                        <div class="form_label">Product Name</div>
                        <input type="text" class="form_field" value="Discovery Set" readonly  id="prod_name">
                    </div>
                    <div class="form_group">
                        <div class="form_label">Quantity</div>
                        <input type="number" class="form_field" value="1" id="prod_quantity" onclick=calcPrice() min="1">
                    </div>
                    <div class="form_group">
                        <div class="form_label">Price</div>
                        <input type="hidden" value="&#8377; 499" id="prod_base_price">
                        <input type="text" class="form_field" value="&#8377; 499" id="total_price" readonly>
                    </div>
                    <div class="form_group">
                        <div class="form_label">Shipping Address</div>
                        <div id="address_group">
                            <input type="textarea" class="form_field" id="adrs_line_one">
                            <input type="textarea" class="form_field" id="adrs_line_two">
                            <div id="address_inner_group">
                                <div class="form_label">City</div>
                                <input type="text" class="form_field" id="adrs_city" required>
                                <div class="form_label right_label">Dist.</div>
                                <input type="text" class="form_field" id="adrs_district" required>
                            </div>
                            <div id="address_inner_group">
                                <div class="form_label">PIN</div>
                                <input type="text" class="form_field" id="adrs_pin" required>
                                <div class="form_label right_label">State</div>
                                <input type="text" class="form_field" id="adrs_state" required>
                            </div>
                        </div>
                    </div>
                    <div class="form_group">
                        <!-- <div class="form_label" id="order_form_submit">Submit</div> -->
                         <input type="submit" class="form_label" id="order_form_submit">
                    </div>
                </form>
                <div id="order_form_footer">
                    <p>Follow Us: <a href="https://www.instagram.com/selvora.aromatic/" target="_blank"><i class="fa-brands fa-instagram" id="order_form_social"></i></a></p>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
